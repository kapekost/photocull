[project]
name = "photocull"
version = "0.1.0"
description = "Local-only macOS app for culling an Apple Photos library and building print albums."
requires-python = ">=3.12"
dependencies = [
    "osxphotos>=0.76",
    "pyobjc-framework-Vision>=12.0",
    "pyobjc-framework-Quartz>=12.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# `src/photocull/` never imports any of these — see `src/photocull_review/__init__.py`
# and tests/test_guardrails.py. photoscript is the write-back driver and belongs on the
# same side of the boundary as the server.
review = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "photoscript>=0.5",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]
# Independent of `review`: needs fastapi/uvicorn but never photoscript, since album
# building never writes to Photos -- see `photocull_album/__init__.py`.
album = ["fastapi>=0.141", "uvicorn>=0.52", "httpx>=0.27", "pytest-playwright>=0.5"]

[project.scripts]
photocull = "photocull.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The frontend ships as data, not as code. Without this an installed (non-editable)
# copy would serve a 500 on `/` — the review package would be present and its static
# directory would not.
[tool.setuptools.package-data]
photocull_review = ["static/*.html", "static/*.css", "static/*.js"]
photocull_album = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ui: browser-driven review-UI test; skipped when Chromium is unavailable",
]
